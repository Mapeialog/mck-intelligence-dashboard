<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f1e9" />
    <title>MCK Intelligence | Central de Gestao</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-lockup" aria-label="MCK Inteligence logo">
          <div class="brand-wordmark"><span>MCK</span><span class="brand-dot">.</span></div>
          <div class="brand-subtitle">advogados</div>
          <div class="brand-meta">INTELLIGENCE</div>
        </div>
        <div class="demo-badge">Dados demonstrativos</div>
        <nav id="main-nav" aria-label="Navegacao principal"></nav>
        <div class="sidebar-foot"><span class="status-dot"></span><span>Ambiente local</span></div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <div><p class="eyebrow">MCK ADVOGADOS <span>·</span> 14 DE SETEMBRO</p><h1 id="page-title">Visao executiva</h1></div>
          <div class="topbar-actions"><span class="last-sync" id="last-sync">Atualizado agora</span><button class="icon-button" id="theme-button" title="Alternar tema" aria-label="Alternar tema">☼</button><button class="icon-button" id="refresh-button" title="Atualizar dados" aria-label="Atualizar dados">↻</button><button class="icon-button" id="export-button" title="Exportar dados" aria-label="Exportar dados">↓</button><button class="avatar" title="Perfil">CS</button></div>
        </header>
        <div class="command-bar"><label class="search-box"><span aria-hidden="true">⌕</span><input id="global-search" type="search" placeholder="Buscar em pessoas, clientes e casos" /></label><span class="shortcut">Ctrl K</span></div>
        <section id="page-content" aria-live="polite"></section>
      </main>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js"></script>
  </body>
</html>
